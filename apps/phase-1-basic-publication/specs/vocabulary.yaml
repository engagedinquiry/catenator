vocabulary:
  - term: "publication"
    definition: >
      A fixed set of topics, sharing sources, variables, and
      personas, refracted together in one action. Unlike Topics,
      Sources/Variables/Personas are fully editable collections.
  - term: "fixed collection"
    definition: >
      A collection whose members cannot be added, removed, or
      reordered — only each member's own content may be edited.
      Applies to Topics in this phase.
  - term: "open collection"
    definition: >
      A collection supporting full add/edit/delete (and, where
      stated, no upper count limit). Applies to Sources, Variables,
      and Personas in this phase.
  - term: "variable substitution"
    definition: >
      A publication-level name/value pair, referenced inside topic
      content as {{variable_name}}.
