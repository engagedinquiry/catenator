systemName: "Creating and Refracting — Publication with topics"
domain: "guided authoring workspace"
intent: >
  The progressive next step from apps/phase-0-single-topic: author a
  publication with a FIXED set of 5 topics, sharing OPEN, uncapped
  Sources/Variables/Personas collections, with per-topic source and
  persona-refraction scoping, refracted together in one action.
mustNever:
  - "Allow adding, deleting, or reordering Topics — the 5 topics are fixed"
  - "Enforce any maximum count on Sources, Variables, or Personas"
  - "Open any Panel 1 selection in a modal dialog"
  - "State a fact in refracted output absent from a topic's own content or its resolved sources"
contentScope:
  inScope:
    - "Publication metadata"
    - "5 fixed topics, content-editable, not structurally editable"
    - "Sources, Variables, Personas — open collections, full CRUD, no cap"
    - "Per-topic source.onlyUse and refraction.personas scoping"
    - "Refraction at the publication level, one action"
  excluded:
    - "Adding/removing/reordering Topics"
    - "Any modal dialog"
    - "refraction.surface / tones / styles (named, not built)"
    - "excludeFrom (named, not built — meaning unresolved)"
  fixedDimensions: ["Surface", "Content", "Context", "Time", "Trust"]

personas:
  - id: author
    accessScope: full
    doing: "Edits topic content, manages Sources/Variables/Personas, triggers refraction"

rule:
  - id: leverage-naming
    rule: "Prefer a recognized convention over restating its behavior; state business-specific facts explicitly."

components:
  - ref: components/layout-three-panel.yaml
  - ref: components/publication-metadata.yaml
  - ref: components/topic-fixed-set.yaml
  - ref: components/source-catalog.yaml
  - ref: components/variable-catalog.yaml
  - ref: components/persona-catalog-open.yaml
  - ref: components/topic-scoping.yaml
  - ref: components/editor-generic.yaml
  - ref: components/guide-static.yaml
  - ref: components/quality-check.yaml
  - ref: components/refraction-publication-level.yaml
  - ref: components/branding-rename.yaml
  - ref: components/style-visual-theme.yaml
