publication.metadata:
  macro:
    systemName: "publication.metadata"
    domain: "content governance"
    intent: >
      Hold the publication's own top-level identity — its display
      name — separate from any individual topic.
    mustNever:
      - "Confuse publication metadata with any individual topic's own content"
  meso:
    personas:
      - id: author
        doing: "Edits the publication's own display name"
    fields:
      displayName: string
  micro:
    - id: default-selection-on-load
      rule: "On a fresh load, Publication metadata's form is shown by default in Panel 2."
    - id: form-not-markdown
      rule: "Publication metadata is structured data — renders as a form, no Preview tab."
