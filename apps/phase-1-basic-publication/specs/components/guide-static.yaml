guide.static-per-selection:
  macro:
    systemName: "guide.static-per-selection"
    domain: "presentation layout"
    intent: >
      Fixed, pre-written text in Panel 3's Guide tab, chosen by which
      of five selection types is active. Not generated, not reactive.
    mustNever:
      - "Generate Guide content dynamically or react to the specific content being edited"
  meso:
    personas:
      - id: author
        doing: "Reads static guidance matching the currently selected item type"
    content:
      selectionTypes: ["Publication", "Topic", "Sources", "Variables", "Personas"]
      blocksPerType: "exactly one pre-written block per type — five total"
  micro:
    - id: five-fixed-blocks
      rule: "Exactly five Guide text blocks, one per selection type."
