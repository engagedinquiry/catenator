editor.generic:
  macro:
    systemName: "editor.generic"
    domain: "presentation layout"
    intent: >
      One reusable editor in Panel 2, rendering as a form (structured
      data) or Metadata/Editor/Preview tabs (markdown), depending on
      what's selected. No modal dialogs anywhere.
    mustNever:
      - "Show a Preview tab for structured data (Publication, Sources,
         Variables, Personas)"
      - "Open any selection in a modal dialog"
  meso:
    personas:
      - id: author
        doing: "Edits whatever is currently selected in Panel 1, inline"
    renderModes:
      - selectionType: "Publication, Sources, Variables, Personas"
        renders: "form"
        tabs: "none"
      - selectionType: "Topic"
        renders: "markdown"
        tabs: "Metadata / Editor / Preview"
  micro:
    - id: no-dialogs-anywhere
      rule: "Zero modal dialogs in this phase."
    - id: default-on-load
      rule: "With nothing selected, Panel 2 shows publication.metadata's form by default."
