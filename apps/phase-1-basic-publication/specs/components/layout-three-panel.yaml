layout.three-panel:
  macro:
    systemName: "layout.three-panel"
    domain: "presentation layout"
    intent: >
      Panel 1 (accordion: Publication, Topics, Sources, Variables,
      Personas), Panel 2 (editor.generic), Panel 3 (Guide + Quality
      Check) — excluding the left icon bar, unchanged from phase-0.
    mustNever:
      - "Let this component alter publication data, topic content,
         or any pipeline/refraction logic"
  meso:
    personas:
      - id: author
        doing: "Selects an item in Panel 1, edits it in Panel 2, reads guidance in Panel 3"
    panels:
      - id: panel-1
        content: "Accordion: Publication, Topics (fixed, 5), Sources (open), Variables (open), Personas (open)"
      - id: panel-2
        content: "editor.generic — the currently selected item, inline"
      - id: panel-3
        content: "Guide tab + Quality Check tab"
  micro:
    - id: accordion-sections-fixed
      rule: "Exactly five accordion sections: Publication, Topics, Sources, Variables, Personas."
    - id: narrow-viewport-notification
      rule: >
        Below 768px viewport width, show a dismissible notification
        stating the app is not optimized for small screens — same
        rule as phase-0-single-topic's layout.three-panel.
