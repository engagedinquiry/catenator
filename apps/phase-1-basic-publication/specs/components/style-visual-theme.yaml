style.visual-theme:
  macro:
    systemName: "style.visual-theme"
    domain: "presentation layout"
    intent: "Apply the same visual style used across all Catenator apps."
    mustNever:
      - "Change any content, hierarchy, or refraction logic as part of this styling pass"
      - "Import or depend on the reference application's codebase at runtime"
  meso:
    personas:
      - id: author
        doing: "Views a consistently styled three-panel layout, accordion, and forms"
    reference:
      preferredSource: "apps/phase-0-single-topic's already-committed design-system tokens"
  micro:
    - id: reuse-phase-0-tokens-first
      rule: "Reuse phase-0-single-topic's tokens directly before falling back to any external reference."
    - id: standalone-styling
      rule: "All styling values are committed into this app's own codebase — nothing loads at runtime from elsewhere."
