# Build config — reader-app

specPath: "apps/reader-app/specs/"
outputPath: "apps/reader-app/output/"

contentSource:
  rootDir: "docs"
  mode: "pre-authored"
  roots:
    - id: personas
      path: "personas/"
      navigationMode: "dropdown"
    - id: schema
      path: "schema/"
      navigationMode: "tree"

techStack:
  frontend: "Angular"

branding:
  productName: "Catenator Reader"
  tagline: "Browse by persona, or view the schema"
  priorNames: []
