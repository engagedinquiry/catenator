vocabulary:
  - term: "reader-controlled delivery"
    definition: >
      A delivery mode where the reader chooses what to view, on
      demand, rather than the system deciding for them. The reader's
      clicks and dropdown selections ARE the navigation — nothing is
      inferred or generated.
  - term: "governed source content"
    definition: >
      Content that already exists as an authored, structured
      document under docs/. This app browses and delivers it; it does
      not author, edit, or generate anything.
  - term: "order-name"
    definition: >
      A folder or file name prefixed with a sortable order (e.g.
      "2-descriptors", "3.1-interface.md"). The prefix is used only
      for numeric sorting; it is stripped before the name is
      displayed to the reader.
  - term: "displayed title"
    definition: >
      What the reader sees as a file's name in the nav panel. This is
      the file's own H1 heading, read from its content — never the
      raw filename. Falls back to the order-stripped filename only if
      the file has no H1.
