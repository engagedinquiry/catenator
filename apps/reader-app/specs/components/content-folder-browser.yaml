content.folder-browser:
  macro:
    systemName: "content.folder-browser"
    domain: "content governance"
    intent: >
      One generic mechanism for browsing a folder of subfolders of
      files — used identically for docs/content/ (subfolder = a
      persona, files = their topics) and docs/schema/ (subfolder = a
      numbered section, files = its documents). No persona names,
      topic names, or filenames are hardcoded anywhere. Whatever
      exists in the folder is what's shown.
    mustNever:
      - "Hardcode a persona name, topic name, or filename anywhere in
         this component — every label shown is read directly from the
         actual folder/file names on disk"
      - "Treat docs/content/ and docs/schema/ as needing different
         logic — both are browsed the same way, by the same mechanism,
         with only the root path differing"
      - "Hardcode a source root path — the root to browse is passed in
         as a parameter, resolved relative to build-config.yaml's
         contentSource.rootDir"
  meso:
    personas:
      - id: reader
        doing: "Picks a subfolder (a persona, or a schema section), then a file within it"
    behavior:
      - "Given a root path, list its immediate subfolders — each one
         is a category the reader can select"
      - "Given a selected subfolder, list the files inside it — each
         one is a topic/document the reader can open"
      - "Given a selected file, return its raw content for display"
  micro:
    - id: two-instances-same-mechanism
      rule: >
        This component is used twice: once rooted at "content/" (its
        subfolders are personas) and once rooted at "schema/" (its
        subfolders are numbered sections). Both uses are the same
        component with a different root parameter — not two separate
        implementations.
    - id: folder-name-is-the-label
      rule: >
        A subfolder's name, and each file's name, is used directly as
        its displayed label — no relabeling, no lookup table. If a
        folder is named "tech-writers", that's what's shown.
    - id: scan-at-build-or-load
      rule: >
        Perform the folder scan once, either at build time or at load
        time — either is acceptable. Nothing about the result requires
        a hardcoded list to exist anywhere in this spec.
