navigation.routes:
  macro:
    systemName: "navigation.routes"
    domain: "reader-controlled delivery"
    intent: >
      Define the app's actual routes, with a home page that renders
      docs/README.md's own content (the "which one is you?" router)
      as the landing page — not a persona/topic view by default.
    mustNever:
      - "Land the reader directly in a persona/topic view on first
         load — the home route must always be the entry point"
      - "Render docs/README.md's persona links as dead links to raw
         markdown files — they must route into this app's own
         persona/topic view, using the link's target folder to
         identify which persona to select"
      - "Duplicate docs/README.md's content by hand — render the
         actual file, the same way content.source renders any other
         topic file"
  meso:
    personas:
      - id: reader
        doing: "Lands on the home page first, picks a persona from there, or navigates directly via URL"
    routes:
      - path: "/"
        renders: "The root index file (README.md, relative to contentSource.rootDir) — docs/README.md itself"
        behavior: >
          Each persona link in this rendered content (e.g.
          "[Creators](creators/README.md)") is intercepted and routed
          internally to /:personaId instead of navigating to the raw
          file — the link's target folder name becomes the personaId.
      - path: "/:personaId"
        renders: "That persona's derived topic list (per content.source), defaulting to their 'start' topic (their own README.md)"
      - path: "/:personaId/:topicId"
        renders: "The specific topic's content for that persona, per delivery.request-response"
  micro:
    - id: home-link-interception
      rule: >
        Parsing docs/README.md's markdown links the same way
        content.source parses each persona's README — a link pointing
        into a known persona's sourceFolder (per persona.catalog)
        becomes an internal route, not an external navigation.
    - id: browser-navigable
      rule: >
        All three route levels (/, /:personaId, /:personaId/:topicId)
        must be real, bookmarkable URLs — a reader can share or
        reload a link directly to a specific persona/topic, not only
        reach it by clicking through from home.
    - id: layout-applies-below-home
      rule: >
        layout.reader-shell's top-bar/topic-list/content-pane
        structure applies to /:personaId and /:personaId/:topicId. The
        home route (/) can use a simpler, single-column rendering of
        docs/README.md's own content, since it has no persona selected
        yet and no topic list to show.