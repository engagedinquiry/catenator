content.browser:
  macro:
    systemName: "content.browser"
    domain: "content governance"
    intent: >
      One recursive mechanism for walking pre-authored folders of
      arbitrary depth under docs/. How a root is presented (dropdown
      vs. tree) is a config value from build-config.yaml's
      contentSource.roots, never hardcoded logic keyed to a root's
      name. Every displayed title comes from the file's own H1, not
      its filename.
    mustNever:
      - "Hardcode a persona name, topic name, filename, or an assumed
         folder depth anywhere in this component"
      - "Hardcode which navigationMode (dropdown/tree) a root uses —
         always read it from build-config.yaml's roots list"
      - "Hardcode a source root path — every root's path is read from
         build-config.yaml, joined with contentSource.rootDir"
      - "Display a folder or file's order prefix (e.g. '2-', '3.1-')
         as part of its shown label — strip it, use it only for sort"
      - "Display a file's raw filename (with or without its .md
         extension) as its title anywhere in the nav panel or the
         browser tab — the displayed title is always the file's own
         H1, falling back to the order-stripped filename only when no
         H1 exists"
  meso:
    personas:
      - id: reader
        doing: "Drills into folders (however deep) until reaching a file, or picks a persona from a dropdown"
    behavior:
      - "Given a root's config (path + navigationMode), list its
         immediate entries."
      - "For each entry: if it's a file, it's clickable — selecting
         it returns its content AND its parsed H1 title. If it's a
         folder, it's drillable — recurse into it the same way,
         regardless of depth."
      - "For navigationMode 'dropdown': the root's immediate
         subfolders become dropdown options, labeled by folder name
         (order-stripped)."
      - "For navigationMode 'tree': the root's structure is rendered
         as an expandable tree, arbitrary depth, matching whatever the
         filesystem actually contains, each entry labeled by its H1
         (files) or folder name (folders, order-stripped)."
      - "For any folder that contains a README.md, that file's parsed
         content is returned alongside the folder listing as the
         folder's default content — see view.state for how this is
         displayed."
  micro:
    - id: recursive-not-fixed-depth
      rule: >
        Never assume a folder's children are all files or all
        folders, and never assume a fixed depth. Check each entry's
        actual type and recurse accordingly, at every level.
    - id: strip-order-prefix-for-display
      rule: >
        A name like "2-descriptors" or "3.1-interface.md" displays as
        "descriptors" or "interface.md" (or its H1, per the title rule
        below) — the leading order token is removed for display only.
        The full original name is retained for sorting and for URL
        routing.
    - id: numeric-sort-by-order-prefix
      rule: >
        Entries are sorted by their order prefix numerically (2 before
        10, 3.1 before 3.2), not alphabetically as plain strings. An
        entry with no order prefix sorts after all entries that have
        one, alphabetically among themselves.
    - id: title-from-h1-not-filename
      rule: >
        Parse each markdown file's first H1 heading and use it as the
        file's displayed title everywhere (nav panel entry, browser
        tab title). If no H1 exists in the file, fall back to the
        order-stripped filename (still without its .md extension) as
        the displayed title — never show the raw filename when an H1
        is present.
    - id: readme-is-folder-default-content
      rule: >
        When a folder (e.g. a persona's folder) contains a README.md,
        that file's content is surfaced as the folder's default
        content — returned as part of selecting that folder, not
        requiring a separate click on README.md in the file list.
    - id: full-markdown-rendering
      rule: >
        File content renders with GFM support, including tables (pipe
        syntax) as real HTML tables, not literal pipe text.
    - id: scan-at-build-or-load
      rule: >
        Perform the scan once, at build time or load time — either is
        acceptable. Nothing about the result requires a hardcoded list
        anywhere in this spec.
