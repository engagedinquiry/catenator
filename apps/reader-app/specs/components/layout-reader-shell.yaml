layout.reader-shell:
  macro:
    systemName: "layout.reader-shell"
    domain: "presentation layout"
    intent: >
      Define the actual page structure: a top bar with the persona
      switcher, a fixed-width topic list on the left, and a content
      pane taking the remaining space — none of which was specified
      before this component existed, which is why layout behaved
      unpredictably.
    mustNever:
      - "Let the topic list panel grow or shrink based on page height
         or content length — it must be a fixed width, independent of
         content"
      - "Position the topic list or persona switcher on the right —
         topic list is left-aligned, persona switcher sits in a top
         bar spanning the full width"
      - "Render the persona switcher as a list of separate buttons or
         radio options — it must be a single dropdown/select control"
  meso:
    personas:
      - id: reader
        doing: "Sees a stable, predictable layout regardless of which topic or persona is active"
    structure:
      - id: top-bar
        position: "full width, top"
        content: "Persona switcher (dropdown), app title/branding"
      - id: topic-list
        position: "left, fixed width"
        width: "fixed — does not expand or contract with page height or content length"
        content: "The list of topics from content-source.yaml's topicMap"
      - id: content-pane
        position: "remaining space, right of topic list"
        content: "Rendered markdown for the currently selected topic + persona"
  micro:
    - id: persona-switcher-is-dropdown
      rule: >
        The persona switcher is a single dropdown/select element
        showing the six personas from persona.catalog — not six
        separate buttons or a list. Selecting a value immediately
        updates the content pane per delivery.request-response.
    - id: fixed-topic-list-width
      rule: >
        The topic list's width is set once (e.g. a fixed pixel or rem
        value) and does not change based on the topic list's own
        content length, the content pane's content, or overall page
        height. This directly fixes the "nav panel expands with page"
        defect.
    - id: no-right-alignment
      rule: >
        Nothing in this layout is right-aligned by default — top bar
        content reads left-to-right (branding/title left, persona
        dropdown can sit right within the top bar specifically, but
        the topic list itself must be left, not right).