layout.shell:
  macro:
    systemName: "layout.shell"
    domain: "presentation layout"
    intent: >
      The actual structural page layout: a fixed-position left panel,
      full viewport height, always visible, containing Home/dropdown/
      Schema docs and whatever's below them. A content pane fills the
      remaining width, scrolling independently.
    mustNever:
      - "Let the left panel scroll with the page, move position, or
         disappear at any viewport width above the mobile breakpoint"
      - "Let the left panel's width change based on its own content
         length or the content pane's content"
  meso:
    personas:
      - id: reader
        doing: "Sees the left panel in the same fixed position regardless of what's in the content pane"
    structure:
      - id: left-panel
        position: "fixed, left, full viewport height, fixed width"
        content: "Home button, Reading-as dropdown, Schema docs button, and whichever of persona-topics/schema-tree is active (per view.state)"
      - id: content-pane
        position: "remaining width, right of left-panel"
        content: "Rendered README, file content, loading state, or not-found state"
  micro:
    - id: left-panel-is-fixed
      rule: >
        The left panel uses fixed positioning with a set width, full
        viewport height. It does not scroll, move, or resize based on
        content, above the mobile breakpoint defined in ui.edge-cases.
    - id: content-pane-scrolls-independently
      rule: "The content pane scrolls on its own; scrolling it never moves or affects the left panel."
    - id: mobile-handoff
      rule: >
        Below ui.edge-cases' mobile breakpoint (768px), this
        component's fixed left panel is what collapses behind the
        toggle control that ui.edge-cases specifies.
