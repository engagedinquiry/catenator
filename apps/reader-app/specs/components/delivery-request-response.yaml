delivery.request-response:
  macro:
    systemName: "delivery.request-response"
    domain: "reader-controlled delivery"
    intent: "Return the correct file's content for the currently selected root + category + file."
    mustNever:
      - "Return content other than what view.state currently has selected"
      - "Read from or write to a URL — input comes directly from
         view.state's activeRoot/selectedCategory/selectedFile"
  meso:
    personas:
      - id: reader
        doing: "Selects via UI; content pane updates from in-memory state"
    contractShape:
      input: [activeRoot, selectedCategory, selectedFile]
      output: markdownContent
  micro:
    - id: reads-from-state-not-url
      rule: >
        This contract's inputs come directly from view.state's current
        values — no URL to parse, no route params to extract.
