content.source:
  macro:
    systemName: "content.source"
    domain: "content governance"
    intent: >
      Load the actual markdown files that back each persona's version
      of a topic, and separately expose the schema reference folder
      (the standard itself) as persona-invariant reference material —
      the same for every reader regardless of which persona they've
      selected.
    mustNever:
      - "Show a persona a file from a different persona's folder"
      - "Treat the schema reference folder as if it varies per
         persona — it's one canonical technical reference, not
         refracted content"
      - "Fail silently if a topic's file is missing for a selected
         persona — report it as unavailable for that persona
         explicitly, not a blank page"
      - "Hardcode a source root path — always resolve every path in
         topicMap and standardReference relative to build-config
         .yaml's contentSource.rootDir"
  meso:
    personas:
      - id: reader
        doing: "Requests a topic for their currently selected persona"
    topicMap:
      # Each topic maps to the actual filename per persona. Filenames
      # differ across personas (e.g. design-document.md vs
      # governing-document.md) even though the topic is analogous.
      - topic: "start"
        filenames:
          creators: "README.md"
          tech-writers: "README.md"
          knowledge-teams: "README.md"
          integrators: "README.md"
          engineers: "README.md"
          governing-docs: "README.md"
      - topic: "governing-document"
        filenames:
          creators: "design-document.md"
          tech-writers: "governing-document.md"
          knowledge-teams: "governing-document.md"
          integrators: "governing-document.md"
          engineers: "governing-document.md"
          governing-docs: null   # not applicable — no equivalent file
      - topic: "refraction"
        filenames:
          creators: "refraction.md"
          tech-writers: "refraction.md"
          knowledge-teams: "refraction.md"
          integrators: "refraction.md"
          engineers: "refraction.md"
          governing-docs: "refraction.md"
      - topic: "mechanics"
        filenames:
          creators: "mechanics-of-refraction.md"
          tech-writers: "mechanics-of-refraction.md"
          knowledge-teams: "mechanics-of-refraction.md"
          integrators: "mechanics-of-refraction.md"
          engineers: "mechanics-of-refraction.md"
          governing-docs: null
      - topic: "delivery"
        filenames:
          creators: "delivering-with-a-paradigm-shift.md"
          tech-writers: "delivering-with-a-paradigm-shift.md"
          knowledge-teams: "delivering-with-a-paradigm-shift.md"
          integrators: "delivering-with-a-paradigm-shift.md"
          engineers: "delivering-with-a-paradigm-shift.md"
          governing-docs: "delivering-with-a-paradigm-shift.md"
      - topic: "schemas-and-specifications"
        filenames:
          creators: null
          tech-writers: null
          knowledge-teams: null
          integrators: null
          engineers: null
          governing-docs: "schemas-and-specifications.md"
    standardReference:
      path: "schema/"   # relative to contentSource.rootDir
      note: >
        Available to every persona identically — a separate "view the
        standard" area, not part of persona-switched topic content.
  micro:
    - id: null-means-unavailable
      rule: >
        A `null` filename for a topic/persona pair means that topic
        has no equivalent for that persona. Display this plainly
        ("Not covered for this persona") rather than a broken link or
        an empty page.
    - id: relative-to-config
      rule: >
        Every path in topicMap and standardReference is joined with
        build-config.yaml's contentSource.rootDir at runtime. Changing
        rootDir to point at a different content tree entirely must not
        require editing this component's paths.
    - id: topic-persists-across-persona-switch
      rule: >
        If the reader is viewing "refraction" and switches persona
        from Creators to Engineers, the app stays on the "refraction"
        topic and loads Engineers' version of it — the topic
        selection persists, only the persona-specific file changes.