navigation.routing:
  macro:
    systemName: "navigation.routing"
    domain: "reader-controlled delivery"
    intent: >
      Every piece of content is reachable by a real, bookmarkable URL
      that mirrors its folder path exactly (e.g.
      /personas/engineers/refraction.md, /schema/3-views/3.1-interface.md).
      Routing is driven entirely by the app's own UI controls — never
      by parsing or intercepting links rendered inside markdown
      content itself. Kept simple deliberately, so the site keeps
      working even if files under docs/ change after the app is built.
    mustNever:
      - "Intercept or parse markdown-rendered <a> tags to derive
         navigation — routes are set only by the app's own controls
         (Home button, dropdown, topic list, schema tree)"
      - "Use a route structure that doesn't mirror the actual folder
         path — the URL segment for a file or folder must match its
         real name (order-prefix included in the URL, since it's part
         of the real path, even though it's stripped for display)"
  meso:
    personas:
      - id: reader
        doing: "Navigates by clicking controls; the URL updates to match; a shared/bookmarked URL loads the same state directly"
    routes:
      - path: "/"
        shows: "Home state — docs/README.md, dropdown and Schema docs both unselected"
      - path: "/personas/:folder"
        shows: "That persona's topic list"
      - path: "/personas/:folder/:file"
        shows: "That persona's file content"
      - path: "/schema/:path*"
        shows: >
          The schema tree state, drilled to whatever depth :path*
          represents — could be a folder (shows tree expanded to that
          point) or a file (shows its content)
  micro:
    - id: url-mirrors-real-path
      rule: >
        A route's path segments are the actual folder/file names on
        disk, including order prefixes — the URL is the real path,
        even though the DISPLAYED label strips the prefix.
    - id: direct-load-works
      rule: >
        Loading any valid route URL directly (not via in-app
        navigation) must produce the correct state — correct mode,
        correct dropdown/tree selection, correct content, correct
        active-state highlighting — not just work when reached by
        clicking through from Home.
    - id: not-found-on-invalid-path
      rule: >
        A route pointing at a file or folder that doesn't exist
        (checked live against content.browser) shows a clear
        not-found state, not a blank page or a crash.
