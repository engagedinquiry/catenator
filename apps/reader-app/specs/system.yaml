systemName: "Catenator Reader"
domain: "reader-controlled delivery"
intent: >
  A home page offering two entry points — browse by persona, or view
  the schema docs — both served by one generic folder-browsing
  mechanism. No persona names, topic names, or filenames are hardcoded
  anywhere. No URL routing.
mustNever:
  - "Generate or modify content — this app only reads and delivers
     what already exists"
  - "Use URL-based routing (Angular Router, path params) — use a
     single in-app view-state variable instead"
  - "Hardcode a persona name, topic name, or filename anywhere in the
     spec — everything shown is read from actual folder/file names"
  - "Treat browsing docs/content/ and docs/schema/ as needing
     different logic — both use the same folder-browsing component"
contentScope:
  inScope:
    - "Home: two options — browse by persona (docs/content/), or view
       schema docs (docs/schema/)"
    - "Category list: subfolders of whichever root was chosen"
    - "File list: files inside the selected subfolder"
    - "Content view: the selected file's rendered content"
  excluded:
    - "URL routing of any kind"
    - "Authoring, editing, or generating content"
    - "Any hardcoded list of personas, topics, or filenames"
personas:
  - id: reader
    accessScope: read-only
    doing: "Picks a root, then a category, then a file — all via simple in-app state"

components:
  - ref: components/content-folder-browser.yaml
  - ref: components/view-state.yaml
  - ref: components/delivery-request-response.yaml
  - ref: components/style-visual-theme.yaml
  - ref: components/branding-rename.yaml
