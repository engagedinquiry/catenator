systemName: "Catenator Reader"
domain: "reader-controlled delivery"
intent: >
  Let a reader select which persona's version of governed content
  they want to view, and switch between personas freely — a Delivery-
  only app. No authoring, no refraction generation: the app reads
  existing governed content and lets the reader choose how to
  receive it.
mustNever:
  - "Generate or modify content — this app only reads and delivers
     what already exists"
  - "Infer a persona for the reader — the reader always chooses
     explicitly, every time"
  - "Track the reader's choice across sessions in a way that decides
     future content on their behalf — each visit starts with an
     explicit choice"
contentScope:
  inScope:
    - "Reading the schema reference folder (the Catenator standard
       itself: founding statement, descriptors, views, -ilities,
       YAML format)"
    - "Switching between the personas already defined under the
       content source root — Creators, Tech writers, Knowledge
       teams, Integrators, Engineers, Governing docs"
  excluded:
    - "Authoring or editing content"
    - "Generating a new persona not already defined in the content
       source"
    - "Live refraction/generation via an AI model — this app delivers
       what's already written, per persona, not generated fresh"
personas:
  - id: reader
    accessScope: read-only
    doing: "Selects a persona and a topic, reads the delivered content, switches freely"

components:
  - ref: components/persona-catalog.yaml
  - ref: components/content-source.yaml
  - ref: components/delivery-request-response.yaml
  - ref: components/style-visual-theme.yaml
  - ref: components/branding-rename.yaml