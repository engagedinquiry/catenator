$schema: "http://json-schema.org/draft-07/schema#"
$id: "https://syntaxia.io/schemas/v1/catenator.project.schema.json"
title: "Syntaxia Project Schema"
description: >-
  The workspace a publication is authored within — the full pool of
  topics, sources, personas, and variables that exist, whether or not
  they're currently referenced by the publication. The publication
  itself stays narrow (per topic.yaml's own isPublication mechanism):
  its own `topics` field is a set of references INTO this pool, not a
  separate copy of the data. A topic can exist here without being in
  the publication yet, or be referenced by more than one publication.
  A project is a document, so it extends base for identity and
  lifecycle history — id/title/description/timestamps/etc. come from
  there; author and client are added here since base has no concept
  of either.

allOf:
  - $ref: "base.yaml"
  - type: object
    required: [author, publication, topics, sources, personas, variables]
    properties:
      author:
        type: string
        description: Who authored this project.

      client:
        type: string
        description: >-
          Who this project is being built for, if it's being done on
          someone else's behalf. Absent for a project with no
          separate client.

      publication:
        $ref: "topic.yaml#/topic"
        description: >-
          The one publication this project is building — a topic
          with isPublication: true, per topic.yaml. Its own `topics`
          field references into this project's `topics` pool below
          by id.

      topics:
        type: array
        description: >-
          Every topic that has been created in this project — the
          full pool, independent of whether the publication
          currently references it. In a real INSTANCE of this
          schema, each entry is {schema, id} pointing at that
          topic's own separate file — the same pattern already used
          for `parts` and `topic-reference` — never the topic's full
          data embedded inline here.
        items:
          $ref: "topic.yaml#/topic-reference"

      sources:
        type: array
        description: The full pool of sources available in this project.
        items:
          $ref: "source.yaml"

      personas:
        type: array
        description: The full pool of personas available in this project.
        items:
          $ref: "persona.yaml"

      variables:
        type: array
        description: >-
          Project-level variables. A topic's own default_vars (per
          topic.yaml) can override any of these for that topic only.
        items:
          type: object
          required: [name, value]
          properties:
            name:
              type: string
            value:
              type: string

    additionalProperties: false