$schema: "http://json-schema.org/draft-07/schema#"
$id: "https://syntaxia.io/schemas/v1/catenator.topic.proccedure-objective.schema.json"
title: "Procedure Objective Topic Schema"
description: What this specific procedure accomplishes.

allOf:
  - $ref: "../schema-templates/topic.yaml#/topic"
  - type: object
    properties:
      requirements:
        type: object
        properties:
          procedure:
            type: string
            description: Which procedure this is, stated explicitly so this part can be evaluated on its own.
          objective:
            type: string
            description: What this procedure accomplishes.
        required: [procedure, objective]
