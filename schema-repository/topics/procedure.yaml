$schema: "http://json-schema.org/draft-07/schema#"
$id: "https://syntaxia.io/schemas/v1/catenator.topic.procedure.schema.json"
title: "Procedure Topic Schema"
description: A concrete, ordered set of actions a reader follows to accomplish something specific.

allOf:
  - $ref: "../schema-templates/topic.yaml#/topic"
  - type: object
    properties:
      title:
        example: Procedure
      content:
        type: array
        minItems: 6
        maxItems: 6
        description: The parts of a procedure, in fixed order.
        prefixItems:
          - $ref: "introductory-content.yaml"
          - $ref: "proccedure-objective.yaml"
          - $ref: "proccedure-prerequisites.yaml"
          - $ref: "proccedure-steps.yaml"
          - $ref: "proccedure-result.yaml"
          - $ref: "proccedure-next-steps.yaml"
