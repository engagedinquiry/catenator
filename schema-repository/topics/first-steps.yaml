$schema: "http://json-schema.org/draft-07/schema#"
$id: "https://syntaxia.io/schemas/v1/catenator.topic.first-steps.schema.json"
title: "First Steps Topic Schema"
description: The actual first actions a reader takes to start using or implementing this.

allOf:
  - $ref: "../schema-templates/topic.yaml#/topic"
  - type: object
    properties:
      requirements:
        type: object
        properties:
          subject:
            type: string
            description: What this topic is about, stated explicitly so it can be evaluated on its own.
          steps:
            type: string
            description: The concrete first actions to take.
        required: [subject, steps]
