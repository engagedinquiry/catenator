$schema: "http://json-schema.org/draft-07/schema#"
$id: "https://syntaxia.io/schemas/v1/catenator.topic.starting-conditions.schema.json"
title: "Trigger Topic Schema"
description: What starts a process — the input or action that kicks it off, and what causes it.

allOf:
  - $ref: "../schema-templates/topic.yaml#/topic"
  - type: object
    properties:
      requirements:
        type: object
        properties:
          subject:
            type: string
            description: What this topic is about, stated explicitly so it can be evaluated on its own.
          causes:
            type: string
            description: What causes this trigger to fire.
        required: [subject, causes]
