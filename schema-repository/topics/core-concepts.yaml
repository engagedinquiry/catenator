$schema: "http://json-schema.org/draft-07/schema#"
$id: "https://syntaxia.io/schemas/v1/catenator.topic.core-concepts.schema.json"
title: "Core Concepts Topic Schema"
description: The essential mechanics of how this actually works, regardless of the reader's prior familiarity.

allOf:
  - $ref: "../schema-templates/topic.yaml#/topic"
  - type: object
    properties:
      requirements:
        type: object
        properties:
          subject:
            type: string
            description: What this topic is about, stated explicitly so it can be evaluated on its own.
          mechanics:
            type: string
            description: The essential mechanics of how this actually works.
        required: [subject, mechanics]
