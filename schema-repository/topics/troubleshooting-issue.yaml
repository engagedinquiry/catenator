$schema: "http://json-schema.org/draft-07/schema#"
$id: "https://syntaxia.io/schemas/v1/catenator.topic.troubleshooting-issue.schema.json"
title: "Troubleshooting Issue Topic Schema"
description: One specific problem, its cause, and its fix.

allOf:
  - $ref: "../schema-templates/topic.yaml#/topic"
  - type: object
    properties:
      requirements:
        type: object
        properties:
          problem:
            type: string
            description: What the reader is experiencing.
          cause:
            type: string
            description: Why it's happening.
          fix:
            type: string
            description: What to do about it.
        required: [problem, cause, fix]
