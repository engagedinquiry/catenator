$schema: "http://json-schema.org/draft-07/schema#"
$id: "https://syntaxia.io/schemas/v1/catenator.topic.troubleshooting.schema.json"
title: "Troubleshooting Topic Schema"
description: Common failure modes for a feature, and how to resolve each one.

allOf:
  - $ref: "../schema-templates/topic.yaml#/topic"
  - type: object
    properties:
      title:
        example: Troubleshooting
      content:
        type: array
        minItems: 1
        description: >-
          An introduction, followed by any number of specific
          troubleshooting issues.
        prefixItems:
          - $ref: "introductory-content.yaml"
        items:
          $ref: "troubleshooting-issue.yaml"
