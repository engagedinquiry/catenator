$schema: "http://json-schema.org/draft-07/schema#"
$id: "https://syntaxia.io/schemas/v1/catenator.topic.context-and-scope.schema.json"
title: "Context and Scope Topic Schema"
description: Establishes background on the subject and what this guide does and does not cover.

allOf:
  - $ref: "../schema-templates/topic.yaml#/topic"
  - type: object
    properties:
      requirements:
        type: object
        properties:
          subject:
            type: string
            description: What this topic is about, stated explicitly so it can be evaluated on its own.
          background:
            type: string
            description: Relevant background on the subject — what came before, why it exists.
          scope:
            type: string
            description: What this guide covers, and what it deliberately does not.
        required: [subject, background, scope]
