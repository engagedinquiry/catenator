$schema: "http://json-schema.org/draft-07/schema#"
$id: "https://syntaxia.io/schemas/v1/catenator.topic.proccedure-result.schema.json"
title: "Procedure Result Topic Schema"
description: What this specific procedure produces once its steps are followed.

allOf:
  - $ref: "../schema-templates/topic.yaml#/topic"
  - type: object
    properties:
      requirements:
        type: object
        properties:
          procedure:
            type: string
            description: Which procedure this is, stated explicitly so this part can be evaluated on its own.
          result:
            type: string
            description: What this procedure produces once followed.
        required: [procedure, result]
