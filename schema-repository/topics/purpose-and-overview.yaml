$schema: "http://json-schema.org/draft-07/schema#"
$id: "https://syntaxia.io/schemas/v1/catenator.topic.purpose-and-overview.schema.json"
title: "Purpose and Overview Topic Schema"
description: States what the subject is and what it's for.

allOf:
  - $ref: "../schema-templates/topic.yaml#/topic"
  - type: object
    properties:
      requirements:
        type: object
        properties:
          whatIsIt:
            type: string
            description: What this thing is, plainly stated.
          whatIsItFor:
            type: string
            description: What this thing is used for, or what problem it solves.
        required: [whatIsIt, whatIsItFor]
