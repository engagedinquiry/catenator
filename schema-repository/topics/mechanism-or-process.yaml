$schema: "http://json-schema.org/draft-07/schema#"
$id: "https://syntaxia.io/schemas/v1/catenator.topic.mechanism-or-process.schema.json"
title: "Process Topic Schema"
description: What actually happens, step by step or in sequence, and toward what objective.

allOf:
  - $ref: "../schema-templates/topic.yaml#/topic"
  - type: object
    properties:
      requirements:
        type: object
        properties:
          subject:
            type: string
            description: What this topic is about, stated explicitly so it can be evaluated on its own.
          objective:
            type: string
            description: What this process is trying to accomplish.
        required: [subject, objective]
