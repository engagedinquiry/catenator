$schema: "http://json-schema.org/draft-07/schema#"
$id: "https://syntaxia.io/schemas/v1/catenator.topic.basic-concepts.schema.json"
title: "Basic Concepts Topic Schema"
description: The essential ideas a first-time reader needs before anything else makes sense.

allOf:
  - $ref: "../schema-templates/topic.yaml#/topic"
  - type: object
    properties:
      requirements:
        type: object
        properties:
          subject:
            type: string
            description: What this topic is about, stated explicitly so it can be evaluated on its own.
          concepts:
            type: string
            description: The essential ideas a reader new to this needs to know first.
        required: [subject, concepts]
