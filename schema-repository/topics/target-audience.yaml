$schema: "http://json-schema.org/draft-07/schema#"
$id: "https://syntaxia.io/schemas/v1/catenator.topic.target-audience.schema.json"
title: "Target Audience Topic Schema"
description: States who this guide is written for.

allOf:
  - $ref: "../schema-templates/topic.yaml#/topic"
  - type: object
    properties:
      requirements:
        type: object
        properties:
          audience:
            type: string
            description: Who this guide is intended for.
        required: [audience]
