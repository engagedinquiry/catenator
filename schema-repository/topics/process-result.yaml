$schema: "http://json-schema.org/draft-07/schema#"
$id: "https://syntaxia.io/schemas/v1/catenator.topic.process-result.schema.json"
title: "Outcome Topic Schema"
description: What results once a process completes, relative to its objective.

allOf:
  - $ref: "../schema-templates/topic.yaml#/topic"
  - type: object
    properties:
      requirements:
        type: object
        properties:
          subject:
            type: string
            description: What this topic is about, stated explicitly so it can be evaluated on its own.
          objective:
            type: string
            description: What this outcome is measured against.
        required: [subject, objective]
