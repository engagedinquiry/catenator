$schema: "http://json-schema.org/draft-07/schema#"
$id: "https://syntaxia.io/schemas/v1/catenator.topic.context.schema.json"
title: "Context Topic Schema"
description: Establishes background on the subject, on its own, without scope.

allOf:
  - $ref: "../schema-templates/topic.yaml#/topic"
  - type: object
    properties:
      requirements:
        type: object
        properties:
          subject:
            type: string
            description: What this topic is about, stated explicitly so it can be evaluated on its own.
          background:
            type: string
            description: Relevant background on the subject — what came before, why it exists.
        required: [subject, background]
