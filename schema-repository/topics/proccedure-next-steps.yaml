$schema: "http://json-schema.org/draft-07/schema#"
$id: "https://syntaxia.io/schemas/v1/catenator.topic.proccedure-next-steps.schema.json"
title: "Procedure Next Steps Topic Schema"
description: What a reader might reasonably do after completing this procedure.

allOf:
  - $ref: "../schema-templates/topic.yaml#/topic"
  - type: object
    properties:
      requirements:
        type: object
        properties:
          procedure:
            type: string
            description: Which procedure this is, stated explicitly so this part can be evaluated on its own.
          nextSteps:
            type: string
            description: What to do after this procedure is complete.
        required: [procedure, nextSteps]
